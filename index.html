<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
      touch-action: none;
    }
    #container {
      width: 100vw;
      height: 60vh;
      touch-action: none;
    }
    .controls {
      padding: 15px;
      color: white;
      background-color: #1a1a1a;
      max-width: 100%;
      overflow-x: hidden;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input[type="text"] {
      padding: 12px;
      font-size: 14px;
      width: 100%;
      max-width: 100%;
      background-color: #2b2b2b;
      color: white;
      border: 1px solid white;
      border-radius: 5px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      background-color: #2b2b2b;
      color: white;
      border: 1px solid white;
      border-radius: 5px;
      flex: 1;
      min-width: 120px;
      touch-action: manipulation;
    }
    button:active {
      background-color: #555;
    }
    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    @media (min-width: 768px) {
      #container {
        height: 70vh;
      }
      .controls {
        padding: 20px;
        text-align: center;
      }
      input[type="text"] {
        max-width: 600px;
      }
      label {
        font-size: 16px;
      }
      button:hover {
        background-color: #555;
      }
      button:active {
        background-color: #666;
      }
    }

    @media (min-width: 1024px) {
      #container {
        height: 75vh;
      }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div class="controls">
    <div class="input-group">
      <label for="scaleInput">Scales (semicolon-separated, each scale comma-separated):</label>
      <input type="text" id="scaleInput" placeholder="0,2,4,5,7,9,11; 0,2,3,5,7,8,11">
      <div class="hint">Tap and hold to edit</div>
    </div>
    <div class="input-group">
      <label for="vectorsInput">Chords (semicolon-separated groups):</label>
      <input type="text" id="vectorsInput" placeholder="60,64,67; 59,62,67">
    </div>
    <div class="input-group">
      <label for="degreeInput">Degrees (semicolon-separated):</label>
      <input type="text" id="degreeInput" placeholder="1; 4; 0">
    </div>
    <div class="button-group">
      <button id="applyBtn">View</button>
      <button id="resetBtn">Reset Camera</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer, spheres = [], transitionInterval, chordLines = [];
    const modulo = 12;
    const maxNumber = 127;
    const ringRadius = 5;
    const layerHeight = 0.8;
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      const container = document.getElementById('container');
      const aspect = container.clientWidth / container.clientHeight;
      camera = new THREE.PerspectiveCamera(isMobile ? 70 : 60, aspect, 0.1, 1000);
      camera.position.set(0, 5, isMobile ? 25 : 20);
      camera.lookAt(0, 5, 0);

      renderer = new THREE.WebGLRenderer({ 
        antialias: !isMobile,
        powerPreference: isMobile ? "low-power" : "high-performance"
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(10, 10, 10);
      scene.add(directionalLight);

      createWheel();
      setupControls();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      const container = document.getElementById('container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function setupControls() {
      let isDragging = false;
      let previousPosition = { x: 0, y: 0 };
      let touchStartDistance = 0;

      // Mouse controls
      renderer.domElement.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousPosition = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const deltaX = e.clientX - previousPosition.x;
          const deltaY = e.clientY - previousPosition.y;
          rotateCamera(deltaX, deltaY);
          previousPosition = { x: e.clientX, y: e.clientY };
        }
      });

      renderer.domElement.addEventListener('mouseup', () => {
        isDragging = false;
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomCamera(e.deltaY);
      }, { passive: false });

      // Touch controls
      renderer.domElement.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
          isDragging = true;
          previousPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          touchStartDistance = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
          const deltaX = e.touches[0].clientX - previousPosition.x;
          const deltaY = e.touches[0].clientY - previousPosition.y;
          rotateCamera(deltaX * 1.5, deltaY * 1.5);
          previousPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const delta = touchStartDistance - distance;
          zoomCamera(delta * 2);
          touchStartDistance = distance;
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchend', (e) => {
        e.preventDefault();
        isDragging = false;
        touchStartDistance = 0;
      }, { passive: false });
    }

    function rotateCamera(deltaX, deltaY) {
      camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * 0.005);
      
      const right = new THREE.Vector3();
      camera.getWorldDirection(right);
      right.cross(camera.up).normalize();
      camera.position.applyAxisAngle(right, deltaY * 0.005);

      camera.lookAt(0, 5, 0);
    }

    function zoomCamera(delta) {
      const zoomSpeed = isMobile ? 0.05 : 0.1;
      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);
      camera.position.addScaledVector(direction, -delta * zoomSpeed * 0.01);
    }

    function createWheel() {
      const maxLayer = Math.ceil(maxNumber / modulo);
      const sphereSize = isMobile ? 0.12 : 0.15;
      const segments = isMobile ? 8 : 16;

      for (let n = 0; n <= maxNumber; n++) {
        const layer = Math.floor(n / modulo);
        const positionInLayer = n % modulo;
        const angle = (positionInLayer / modulo) * Math.PI * 2;
        const y = layer * layerHeight;

        const x = ringRadius * Math.cos(angle);
        const z = ringRadius * Math.sin(angle);

        const geometry = new THREE.SphereGeometry(sphereSize, segments, segments);
        const material = new THREE.MeshStandardMaterial({ 
          color: 0x2b2b2b,
          emissive: 0x000000,
          emissiveIntensity: 0
        });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.position.set(x, y, z);
        sphere.userData.number = n;
        sphere.userData.originalScale = 1;
        scene.add(sphere);
        spheres.push(sphere);
      }

      // Add ring guides
      for (let layer = 0; layer < maxLayer; layer++) {
        const ringGeometry = new THREE.RingGeometry(ringRadius - 0.05, ringRadius + 0.05, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({ 
          color: 0xffffff, 
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.1
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = layer * layerHeight;
        scene.add(ring);
      }
    }

    function view(scales, vectors, degrees) {
      const transitionDuration = 1500;
      let scaleIndex = 0;

      function highlight() {
        chordLines.forEach(line => scene.remove(line));
        chordLines = [];

        spheres.forEach(sphere => {
          sphere.material.color.setHex(0x2b2b2b);
          sphere.material.emissive.setHex(0x000000);
          sphere.material.emissiveIntensity = 0;
          sphere.scale.set(1, 1, 1);
        });

        const currentScaleNotes = new Set(scales[scaleIndex].map(note => note % modulo));
        const degreeIndex = (degrees[scaleIndex] + scales[scaleIndex].length) % scales[scaleIndex].length;
        const degreeNote = scales[scaleIndex][degreeIndex];
        const currentVectorNotes = new Set(vectors[scaleIndex]);
        const vectorSpheres = [];

        spheres.forEach(sphere => {
          const number = sphere.userData.number;

          if (number === scales[scaleIndex][0]) {
            sphere.material.color.setHex(0xC76E00);
            sphere.material.emissive.setHex(0xC76E00);
            sphere.material.emissiveIntensity = 0.5;
            sphere.scale.set(1.618, 1.618, 1.618);
          } else if (currentScaleNotes.has(number % modulo)) {
            sphere.material.color.setHex(0x78d5eb);
            sphere.material.emissive.setHex(0x78d5eb);
            sphere.material.emissiveIntensity = 0.3;
          }

          if (currentVectorNotes.has(number)) {
            sphere.material.color.setHex(0xfcbc2f);
            sphere.material.emissive.setHex(0xfcbc2f);
            sphere.material.emissiveIntensity = 0.5;
            sphere.scale.set(1.618, 1.618, 1.618);
            vectorSpheres.push(sphere);
          }

          if (number === degreeNote) {
            sphere.material.color.setHex(0xff0000);
            sphere.material.emissive.setHex(0xff0000);
            sphere.material.emissiveIntensity = 0.8;
            sphere.scale.set(1.618, 1.618, 1.618);
          }
        });

        if (vectorSpheres.length > 1) {
          const center = new THREE.Vector3(0, 0, 0);
          vectorSpheres.forEach(sphere => {
            const pos = sphere.position.clone();
            pos.y = 0;
            sphere.userData.angle = Math.atan2(pos.z, pos.x);
          });
          vectorSpheres.sort((a, b) => a.userData.angle - b.userData.angle);

          for (let i = 0; i < vectorSpheres.length; i++) {
            const nextIndex = (i + 1) % vectorSpheres.length;
            const points = [
              vectorSpheres[i].position,
              vectorSpheres[nextIndex].position
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
              color: 0xfcbc2f,
              transparent: true,
              opacity: 0.6
            });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            chordLines.push(line);
          }
        }

        scaleIndex = (scaleIndex + 1) % scales.length;
      }

      clearInterval(transitionInterval);
      transitionInterval = setInterval(highlight, transitionDuration);
      highlight();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    init();

    document.getElementById('applyBtn').addEventListener('click', () => {
      const scaleInput = document.getElementById('scaleInput').value;
      const vectorsInput = document.getElementById('vectorsInput').value;
      const degreeInput = document.getElementById('degreeInput').value;

      const scales = scaleInput.split(';').map(scale => 
        scale.split(',').map(num => parseInt(num.trim(), 10)).filter(n => !isNaN(n))
      );
      const vectors = vectorsInput.split(';').map(group => 
        group.split(',').map(num => parseInt(num.trim(), 10)).filter(n => !isNaN(n))
      );
      const degrees = degreeInput.split(';').map(num => parseInt(num.trim(), 10)).filter(n => !isNaN(n));

      view(scales, vectors, degrees);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      camera.position.set(0, 5, isMobile ? 25 : 20);
      camera.lookAt(0, 5, 0);
    });

    const initialScales = [[0, 2, 4, 5, 7, 9, 11], [0, 2, 4, 5, 7, 9, 11], [0, 2, 4, 5, 7, 9, 11]];
    const initialVectors = [[62, 65, 69, 72], [62, 65, 67, 71], [60, 64, 67, 71]];
    const initialDegrees = [1, 4, 0];
    view(initialScales, initialVectors, initialDegrees);
  </script>
</body>
</html>
